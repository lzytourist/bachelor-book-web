<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Bachelor Book app icon — "Open book + steaming meal bowl"
    Palette aligned with AppTheme:
      • Charcoal Slate ground (#2F3740 → #14181E)
      • Soft Gray / Crisp White pages (#FFFFFF → #E9ECEF)
      • Brand Teal bowl & accents (#2DD4BF / #14B8A6 / #0F766E)
  -->
  <defs>
    <!-- Deep Charcoal brand tile background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F3740"/>
      <stop offset="1" stop-color="#14181E"/>
    </linearGradient>

    <!-- Subtle ambient teal glow behind the bowl -->
    <radialGradient id="ambientGlow" cx="0.5" cy="0.34" r="0.58">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#0F766E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#14181E" stop-opacity="0"/>
    </radialGradient>

    <!-- Left page gradient (bright outer edge, gentle fold shadow toward spine) -->
    <linearGradient id="leftPage" x1="0" y1="0.3" x2="1" y2="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#F1F3F5"/>
      <stop offset="1" stop-color="#CED4DA"/>
    </linearGradient>

    <!-- Right page gradient (fold shadow near spine, bright outer edge) -->
    <linearGradient id="rightPage" x1="0" y1="0.5" x2="1" y2="0.3">
      <stop offset="0" stop-color="#C6CDD4"/>
      <stop offset="0.22" stop-color="#ECEFF2"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Bowl exterior teal gradient -->
    <linearGradient id="bowlBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.48" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D6E66"/>
    </linearGradient>

    <!-- Bowl rim highlight -->
    <linearGradient id="bowlRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Steam soft gradient -->
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F9FA" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed square background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Core mark scaled cleanly for Play Store & in-app presence -->
  <g transform="translate(256 260) scale(1.14) translate(-256 -248)">
    <!-- ── BOOK COVER BASE ── -->
    <path d="M 116 356
             L 116 268
             Q 116 258 126 256
             L 256 276
             L 386 256
             Q 396 258 396 268
             L 396 356
             Q 396 368 384 366
             Q 318 354 256 382
             Q 194 354 128 366
             Q 116 368 116 356 Z"
          fill="#0F766E"/>

    <!-- Soft shadow beneath pages onto cover -->
    <path d="M 124 352
             Q 188 338 256 368
             Q 324 338 388 352
             L 388 360
             Q 324 346 256 376
             Q 188 346 124 360 Z"
          fill="#0A2E2B" opacity="0.45"/>

    <!-- ── OPEN BOOK PAGES (joined cleanly at x=256 spine) ── -->
    <!-- Left page -->
    <path d="M 124 350
             L 124 258
             Q 162 238 206 244
             Q 236 248 256 266
             L 256 368
             Q 214 344 166 344
             Q 142 344 124 350 Z"
          fill="url(#leftPage)"/>

    <!-- Right page -->
    <path d="M 388 350
             L 388 258
             Q 350 238 306 244
             Q 276 248 256 266
             L 256 368
             Q 298 344 346 344
             Q 370 344 388 350 Z"
          fill="url(#rightPage)"/>

    <!-- Crisp spine crease -->
    <line x1="256" y1="266" x2="256" y2="368"
          stroke="#6C757D" stroke-width="2.5" opacity="0.45"/>

    <!-- Ledger lines on left page -->
    <g stroke="#0F766E" stroke-width="7.5" stroke-linecap="round" opacity="0.72">
      <line x1="150" y1="286" x2="222" y2="294"/>
      <line x1="150" y1="312" x2="206" y2="318"/>
    </g>

    <!-- Ledger lines on right page -->
    <g stroke="#0F766E" stroke-width="7.5" stroke-linecap="round" opacity="0.72">
      <line x1="290" y1="294" x2="362" y2="286"/>
      <line x1="306" y1="318" x2="362" y2="312"/>
    </g>

    <!-- Soft shadow cast by the bowl onto the upper pages -->
    <ellipse cx="256" cy="256" rx="68" ry="11" fill="#14181E" opacity="0.18"/>

    <!-- ── STEAMING MEAL BOWL ── -->
    <g transform="translate(256 192)">
      <!-- Deep rounded bowl body -->
      <path d="M -86 0
               C -86 44 -48 58 0 58
               C 48 58 86 44 86 0
               Z"
            fill="url(#bowlBody)"/>
      <!-- Subtle specular highlight on left curve of bowl -->
      <path d="M -68 13 C -61 36 -39 46 -17 48"
            fill="none" stroke="#99F6E4" stroke-width="5"
            stroke-linecap="round" opacity="0.34"/>
      <!-- Bowl top rim -->
      <ellipse cx="0" cy="0" rx="86" ry="20" fill="url(#bowlRim)"/>
      <!-- Inner bowl recess -->
      <ellipse cx="0" cy="2" rx="70" ry="12" fill="#0B5C55" opacity="0.78"/>
      <!-- Warm rice/meal mound hint inside bowl -->
      <path d="M -46 3 Q 0 -10 46 3 Q 0 11 -46 3 Z"
            fill="#F8F9FA" opacity="0.94"/>
    </g>

    <!-- ── RISING STEAM (organic S-curves, varied height) ── -->
    <g fill="none" stroke="url(#steamGrad)" stroke-width="10"
       stroke-linecap="round">
      <path d="M 214 162 C 204 148 222 136 212 122"/>
      <path d="M 256 154 C 244 136 268 122 256 104"/>
      <path d="M 298 162 C 288 148 306 136 296 122"/>
    </g>
  </g>
</svg>
